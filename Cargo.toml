[package]
name = "ro3-translation-editor"
version = "0.4.1"
edition = "2021"
description = "Native TSV translation editor for RO3 localization projects"
license = "MIT"
repository = "https://github.com/glitzhXEC/RO3_Translation_Editor"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.31"
rfd = "0.15"
csv = "1.3"
walkdir = "2.5"
regex = "1.11"
once_cell = "1.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
opt-level = 2
